name: Rainyun 自动签到

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 04:00 = 北京时间 12:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 缓存Python依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装Chrome和ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable curl unzip
          pip install webdriver-manager chromedriver-binary-auto

      - name: 确保temp目录存在
        run: mkdir -p temp

      - name: 执行签到脚本
        run: python rainyun.py
        env:
          # 请在 GitHub 仓库 Settings > Secrets and variables > Actions 中设置
          RAINYUN_USER: ${{ secrets.RAINYUN_USER }}
          RAINYUN_PASS: ${{ secrets.RAINYUN_PASS }}

          # Push+
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}

          # SMTP 邮件
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NAME: ${{ secrets.SMTP_NAME }}

          # Bark
          BARK_PUSH: ${{ secrets.BARK_PUSH }}

          # 钉钉
          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}

          # 飞书
          FSKEY: ${{ secrets.FSKEY }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}

          # Server 酱
          PUSH_KEY: ${{ secrets.PUSH_KEY }}

          # 运行模式
          HEADLESS: "true"
          DEBUG: "false"
          CHROMEDRIVER_PATH: "chromedriver"

      - name: 每50天保活一次
        if: always()
        run: |
          set -e
          KEEPALIVE_FILE=".keepalive"
          TODAY=$(date -u +%Y-%m-%d)

          if [ -f "$KEEPALIVE_FILE" ]; then
            LAST=$(tr -d '\r\n' < "$KEEPALIVE_FILE")
          else
            LAST="1970-01-01"
          fi

          LAST_TS=$(date -u -d "$LAST" +%s)
          TODAY_TS=$(date -u -d "$TODAY" +%s)
          DIFF_DAYS=$(( (TODAY_TS - LAST_TS) / 86400 ))

          echo "上次保活日期: $LAST"
          echo "当前日期: $TODAY"
          echo "间隔天数: $DIFF_DAYS"

          if [ "$DIFF_DAYS" -ge 50 ]; then
            echo "$TODAY" > "$KEEPALIVE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEEPALIVE_FILE"
            git commit -m "chore: keepalive $TODAY" || true
            git push
          else
            echo "未满50天，跳过保活提交。"
          fi

      - name: 清理临时文件
        run: rm -rf temp
        if: always()
